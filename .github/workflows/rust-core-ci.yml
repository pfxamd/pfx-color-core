name: Rust Color Core CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-and-webassembly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Run scientific, FFI and boundary tests
        run: cargo test --workspace --all-targets
      - name: Check code quality
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build portable native Rust and C ABI libraries
        run: cargo build --workspace --release
      - name: Verify real native C program linked to Rust library
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Ibindings/c \
            bindings/c/smoke.c -Ltarget/release -lpfx_color_ffi -lm \
            -Wl,-rpath,"$PWD/target/release" -o /tmp/pfx-color-ffi-smoke
          /tmp/pfx-color-ffi-smoke
      - name: Compile for WebAssembly
        run: cargo build --workspace --target wasm32-unknown-unknown --release
      - name: Test real WebAssembly from JavaScript (Node.js)
        run: node --test bindings/javascript/pfx-color-core.smoke.mjs
      - name: Install legacy TypeScript reference dependencies for parity
        run: npm install --no-audit --no-fund
      - name: Build legacy reference package for parity
        run: npm run build
      - name: Compare Rust WebAssembly against real TypeScript engine
        run: node --test bindings/javascript/legacy-parity.smoke.mjs
      - name: Verify opt-in Rust color-picker interface against legacy
        run: node --test bindings/javascript/pfx-color-tools.smoke.mjs
      - name: Bundle tested standalone WebAssembly engine
        uses: actions/upload-artifact@v4
        with:
          name: pfx-color-core-wasm-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            target/wasm32-unknown-unknown/release/pfx_color_ffi.wasm
            bindings/javascript/pfx-color-core.mjs
            LICENSE
            docs/portable-bindings.md
      - name: Bundle tested native Linux engine
        uses: actions/upload-artifact@v4
        with:
          name: pfx-color-core-linux-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            target/release/libpfx_color_ffi.so
            target/release/libpfx_color_ffi.a
            bindings/c/pfx_color_core.h
            LICENSE
            docs/portable-bindings.md
