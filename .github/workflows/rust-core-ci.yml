name: Rust Color Core CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-and-webassembly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Run scientific and boundary tests
        run: cargo test --workspace --all-targets
      - name: Check code quality
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build portable Rust library
        run: cargo build --workspace --release
      - name: Compile for WebAssembly
        run: cargo build --workspace --target wasm32-unknown-unknown --release
