name: Publish Color Core

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release: v') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve deterministic core version
        run: node .pfx/release.mjs --sync
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate core
        run: npm run check && npm run build
      - name: Publish versioned package archive and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already published"
            exit 0
          fi
          PACKAGE=$(npm pack --silent)
          gh release create "$TAG" "$PACKAGE" \
            --target "$GITHUB_SHA" \
            --title "PFx Color Core $TAG" \
            --notes-file RELEASE_NOTES.md \
            --latest
