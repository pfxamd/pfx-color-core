name: Publish Core v0.1.0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: "${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'release: v0.1.0' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate core
        run: npm run check && npm run build
      - name: Publish versioned package archive and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo "v0.1.0 already published"
            exit 0
          fi
          PACKAGE=$(npm pack --silent)
          gh release create v0.1.0 "$PACKAGE" \
            --target "$GITHUB_SHA" \
            --title "PFx Color Core v0.1.0" \
            --notes-file RELEASE_NOTES.md \
            --latest
